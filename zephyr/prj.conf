# Habilita suporte a Threads e Multithreading
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=15

# Ativa o divisão de tempo (Time-Slicing) para threads de mesma prioridade
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_TIMESLICE_PRIORITY=0

# Habilita o subsistema de LOG do Zephyr
CONFIG_LOG=y
# LOG_MODE_IMMEDIATE evita o buffering e imprime as mensagens na hora exata em que ocorrem
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y